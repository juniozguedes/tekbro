<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tek Bro</title>
<!-- Vendored locally (no CDN): works offline, no third-party script supply chain. -->
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<link rel="stylesheet" href="/vendor/github-dark.min.css">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e8ee; --muted:#8a92a5; --accent:#5ec4ff; --ok:#4ade80; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system, system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 8px 0 0; display:flex; align-items:center; gap:8px; }
  header .mascot { height:40px; width:auto; display:block; }
  header .meta { color:var(--muted); font-size:12px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.on { border-color:var(--ok); color:var(--ok); }
  main { display:grid; grid-template-columns: minmax(0,2fr) minmax(280px,1fr); height:calc(100vh - 61px); }
  #answers { overflow:auto; padding:16px; }
  aside { border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  aside img { width:100%; border-bottom:1px solid var(--line); display:block; }
  #transcript { overflow:auto; padding:12px; flex:1; font-size:13px; }
  .line { margin:0 0 6px; } .line b { color:var(--accent); font-weight:600; }
  .line.me b { color:var(--muted); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:14px; }
  .card h3 { margin:0 0 6px; font-size:12px; color:var(--muted); font-weight:500; display:flex; justify-content:space-between; }
  .card.none { opacity:.4; }
  .card .heard { margin:0 0 8px; padding:6px 10px; border-left:3px solid var(--accent); background:rgba(127,127,127,.08); border-radius:0 6px 6px 0; font-style:italic; }
  .card pre { position:relative; border-radius:6px; overflow:auto; }
  .card pre button.copy { position:absolute; top:6px; right:6px; padding:2px 8px; font-size:12px; }
  .card h2 { font-size:14px; margin:12px 0 4px; color:var(--accent); }
  form { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
  input { flex:1; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  @media (max-width: 800px) { main { grid-template-columns:1fr; height:auto; } aside { border-left:0; border-top:1px solid var(--line); } }
  /* Phone (paired over Tailscale): bigger tap targets, answers first, readable code. */
  @media (max-width: 600px) {
    main { grid-template-columns:minmax(0,1fr); } aside, #answers { min-width:0; }
    header { padding:8px 12px; gap:8px; } header h1 { width:100%; } header .meta { width:100%; }
    header button { flex:1 1 auto; padding:10px 12px; font-size:15px; }
    form input { min-width:0; }
    #answers { padding:10px; } .card { padding:10px 12px; } .card pre { font-size:13px; }
    .card pre button.copy { padding:6px 12px; font-size:14px; }
    #transcript { max-height:40vh; } input { font-size:16px; } /* 16px stops iOS zooming in */
  }
</style>
</head>
<body>
<header>
  <h1><svg class="mascot" aria-hidden="true" viewBox="100 76 400 334">
    <line stroke="#9aa3b5" opacity=".5" x1="110" y1="400" x2="490" y2="400" stroke-width="4" stroke-linecap="round"/>

    <!-- the hug: bro's arm goes behind the nerd's back (drawn first, so the nerd covers it) -->
    <path stroke="#e8b48f" fill="none" d="M310 250 Q258 262 204 268" stroke-width="30" stroke-linecap="round"/>

    <!-- nerd -->
    <path stroke="#f3c9a8" fill="none" d="M192 262 Q176 300 178 340" stroke-width="18" stroke-linecap="round"/>
    <path fill="#5b8def" d="M185 290 Q185 245 230 245 Q275 245 275 290 L275 400 L185 400 Z"/>
    <circle fill="#f3c9a8" cx="230" cy="190" r="42"/>
    <g stroke="#1d2333" fill="none" stroke-width="4">
      <circle cx="214" cy="192" r="13"/><circle cx="246" cy="192" r="13"/>
      <line x1="227" y1="192" x2="233" y2="192"/>
      <path d="M221 215 Q230 222 239 215" stroke-linecap="round"/>
    </g>

    <!-- bro -->
    <path stroke="#e8b48f" fill="none" d="M452 245 Q474 290 470 340" stroke-width="30" stroke-linecap="round"/>
    <path fill="#ff5a5f" d="M302 220 Q370 202 438 220 Q462 226 462 252 L448 400 L296 400 L280 252 Q280 226 302 220 Z"/>
    <!-- chest muscles -->
    <g fill="none" stroke="#d9434a" stroke-width="4" stroke-linecap="round">
      <path d="M318 262 Q340 292 368 274"/>
      <path d="M372 274 Q400 292 422 262"/>
      <path d="M370 236 L370 270"/>
    </g>
    <circle fill="#e8b48f" cx="370" cy="152" r="46"/>
    <!-- #1 cap -->
    <path d="M408 134 Q440 131 454 141 Q432 147 408 145 Z" style="fill:#2b3350"/>
    <path d="M323 140 Q324 96 370 94 Q416 96 417 140 Q370 132 323 140 Z" style="fill:#2b3350"/>
    <text x="370" y="128" text-anchor="middle" font-family="Space Grotesk, system-ui, sans-serif" font-weight="700" font-size="24" style="fill:#ffffff">#1</text>
    <!-- sunglasses -->
    <g style="fill:#1d2333">
      <path d="M336 144 H366 V152 Q366 164 352 164 Q338 164 336 152 Z"/>
      <path d="M374 144 H404 V152 Q402 164 388 164 Q374 164 374 152 Z"/>
      <rect x="330" y="142" width="80" height="5" rx="2.5"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".7">
      <path d="M342 151 L350 151"/><path d="M380 151 L388 151"/>
    </g>
    <path stroke="#1d2333" fill="none" d="M354 176 Q370 190 386 176" stroke-width="4" stroke-linecap="round"/>

    <!-- the bro's hand wraps around to the nerd's far shoulder -->
    <circle fill="#e8b48f" cx="194" cy="270" r="17"/>
  </svg><span>Tek Bro</span></h1>
  <button id="solve">Solve screen (s)</button>
  <button id="answer">Answer last question (a)</button>
  <button id="autoScreen">Auto screen</button>
  <button id="autoAnswer">Auto answer</button>
  <span class="meta" id="meta"></span>
  <span class="meta" id="usage" title="Claude plan usage in the current 5-hour window"></span>
</header>
<main>
  <section id="answers"></section>
  <aside>
    <img id="shot" alt="" onerror="this.hidden=true" onload="this.hidden=false">
    <div id="transcript"></div>
    <form id="askForm"><input id="ask" placeholder="Ask Tek Bro (uses current screen)…" autocomplete="off"><button>Ask</button></form>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
const cards = {}, buffers = {};
const post = (url, body) => fetch(url, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body||{})}).then(r=>r.json());

function render(id) {
  const body = cards[id].querySelector('.body');
  // Sanitize: Claude's output can echo text from the screen/transcript, which must never run as HTML/JS.
  body.innerHTML = DOMPurify.sanitize(marked.parse(buffers[id] || '…'));
  body.querySelectorAll('pre code').forEach(el => {
    hljs.highlightElement(el);
    const btn = document.createElement('button');
    btn.className = 'copy'; btn.textContent = 'copy';
    btn.onclick = () => { navigator.clipboard.writeText(el.innerText); btn.textContent = 'copied'; };
    el.parentElement.appendChild(btn);
  });
}

const es = new EventSource('/events');
es.onmessage = m => {
  const ev = JSON.parse(m.data);
  if (ev.type === 'transcript') {
    const d = document.createElement('p');
    d.className = 'line ' + ev.speaker;
    d.innerHTML = `<b>${ev.speaker}</b> `; d.append(ev.text);
    $('#transcript').append(d); $('#transcript').scrollTop = 1e9;
  } else if (ev.type === 'screen') {
    $('#shot').src = '/api/screen.png?t=' + Date.now();
  } else if (ev.type === 'job_start') {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<h3><span></span><span>${new Date(ev.ts*1000).toLocaleTimeString()}</span></h3><div class="body">…</div>`;
    c.querySelector('h3 span').textContent = ev.title;
    if (ev.heard) {  // the question being answered (plain text, never HTML)
      const q = document.createElement('p');
      q.className = 'heard'; q.textContent = '“' + ev.heard + '”';
      c.querySelector('.body').before(q);
    }
    cards[ev.id] = c; buffers[ev.id] = '';
    $('#answers').prepend(c);
  } else if (ev.type === 'delta' && cards[ev.id]) {
    buffers[ev.id] += ev.text; render(ev.id);
  } else if (ev.type === 'usage') {
    const pct = Math.round(ev.five_hour * 100);
    const reset = ev.resets_at ? ' · resets ' + new Date(ev.resets_at * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : '';
    $('#usage').textContent = `plan usage: ${pct}%${reset}`;
    $('#usage').style.color = pct >= 80 ? '#f87171' : '';
  } else if (ev.type === 'job_end' && !cards[ev.id]) {
    // replayed after a reconnect: rebuild the card from the final text
    es.onmessage({data: JSON.stringify({type: 'job_start', id: ev.id, title: ev.title || 'Answer', heard: ev.heard, ts: ev.ts || Date.now() / 1000})});
    buffers[ev.id] = ev.text; render(ev.id);
    if (ev.none) cards[ev.id].classList.add('none');
  } else if (ev.type === 'job_end' && cards[ev.id]) {
    buffers[ev.id] = ev.text; render(ev.id);
    if (ev.none) cards[ev.id].classList.add('none');
  }
};

function paintState(s) {
  $('#autoScreen').classList.toggle('on', s.auto_screen);
  $('#autoAnswer').classList.toggle('on', s.auto_answer);
  if (s.model) $('#meta').textContent = `model: ${s.model} · audio: ${s.audio.join(', ') || 'off'} · screen: ${s.screen ? 'on' : 'off'}`;
}
let state = {};
fetch('/api/state').then(r=>r.json()).then(s => { state = s; paintState(s); });
$('#solve').onclick = () => post('/api/solve');
$('#answer').onclick = () => post('/api/answer');
$('#autoScreen').onclick = () => post('/api/auto', {screen: !state.auto_screen}).then(s => { Object.assign(state, s); paintState(state); });
$('#autoAnswer').onclick = () => post('/api/auto', {answer: !state.auto_answer}).then(s => { Object.assign(state, s); paintState(state); });
$('#askForm').onsubmit = e => { e.preventDefault(); const t = $('#ask').value.trim(); if (t) post('/api/ask', {text: t}); $('#ask').value = ''; };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 's') post('/api/solve');
  if (e.key === 'a') post('/api/answer');
});
$('#shot').src = '/api/screen.png';
</script>
</body>
</html>
